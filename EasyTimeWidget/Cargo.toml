[package]
name = "EasyTimeWidget"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "EasyTimeWidget"
path = "src/main.rs"

[dependencies]
eframe = "0.24"
egui = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
directories = "5.0"
tokio = { version = "1.35", features = ["rt-multi-thread"] }
anyhow = "1.0"
thiserror = "1.0"
winapi = { version = "0.3", features = ["winuser", "windef"] }

[profile.release]
opt-level = 3
lto = true
